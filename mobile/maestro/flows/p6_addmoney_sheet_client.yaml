appId: com.taskbuddy.app
name: p6 client Add Money sheet presets and floor gate Continue
tags:
  - client
  - wallet
---
# Slice 6.3 rows 6.3-01, 6.3-02, 6.3-06 and 6.3-14 (client maestro.client2@, c2): the Add Money sheet on the
# Wallet screen shows Continue disabled with the "Minimum ₱50" hint; the ₱500 preset fills 500 and
# enables Continue; 49.99 (below the ₱50 floor) leaves Continue disabled; Cancel closes the sheet (this flow
# checks only that it closes; the cleared-field and Android Back halves of 6.3-14 are not covered here).
# Read-only on money: the flow never taps Continue, so it never opens Stripe (no Custom Tab, no top-up request).
# It creates no job and moves no money; c2's GET /wallet stays at balance 150 with 2 transactions.
# Login is inlined from p6_wallet_matches_api_client.yaml (same steps, plus the email-doubling guard). The guard
# erases the field and types the address again when the exact address is not on screen.
# The amount field has no testID, so it is tapped by point (65%,65%) exactly once, right after the sheet opens,
# while the soft keyboard is down. With the keyboard up the sheet shifts about 652 px and that point would land on
# Continue, so every later tap is by id or relative to Continue. Never add a point tap after the first input.
# Cancel has no testID, so it is tapped relative to Continue, because the keyboard moves the sheet up.
# No hideKeyboard after the amount is typed: with no keyboard up it presses system Back and closes the sheet.
- runFlow: _helpers/launch_fresh.yaml
- tapOn:
    id: "input-email"
- inputText: "maestro.client2@taskbuddy.test"
- runFlow:
    when:
      notVisible: "maestro.client2@taskbuddy.test"
    commands:
      - eraseText: 60
      - inputText: "maestro.client2@taskbuddy.test"
- tapOn:
    id: "input-password"
- inputText: "TestPass123!"
- hideKeyboard
- tapOn:
    id: "btn-sign-in"
- extendedWaitUntil:
    visible: ".*(Skip|Find a service).*"
    timeout: 60000
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible: "Find a service"
    timeout: 60000
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    id: "nav-tab-Wallet"
# Row 6.3-01: the sheet opens empty, with the minimum hint and Continue disabled.
- tapOn: "Add Money"
- assertVisible:
    id: "add-money-dialog"
- assertVisible: "Minimum ₱50"
- assertVisible:
    id: "wallet-add-money-continue"
    enabled: false
# Row 6.3-06: type 49.99 first, while the soft keyboard is still DOWN (it does not open on its own, E2E-122), so
# the point tap on the field cannot land on a shifted button. The hint stays and Continue is disabled.
- tapOn:
    point: "65%,65%"
- inputText: "49.99"
- assertVisible: "49.99"
- assertVisible: "Minimum ₱50"
- assertVisible:
    id: "wallet-add-money-continue"
    enabled: false
# Row 6.3-02: the ₱500 preset (by id, so the keyboard-shifted layout does not matter) replaces the value with
# 500 and enables Continue. Continue is not tapped.
- tapOn:
    id: "wallet-quick-500"
- assertVisible: "500"
- assertVisible:
    id: "wallet-add-money-continue"
    enabled: true
# Row 6.3-14: Cancel closes the sheet (Continue is never tapped; Cancel sits left of Continue).
- tapOn:
    text: "Cancel"
    leftOf: "Continue"
- assertNotVisible:
    id: "add-money-dialog"
