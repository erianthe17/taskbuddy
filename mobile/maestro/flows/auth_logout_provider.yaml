appId: com.taskbuddy.app
---
# Phase 1: provider sign out from Profile, mirroring auth_logout_client.yaml.
- runFlow: _helpers/login_provider.yaml
- tapOn:
    id: "btn-home-avatar"
# The redesigned provider profile (menu rows + Account Info card) pushes Log Out
# below the fold on a 1080x2400 screen, so scroll to it first.
- scrollUntilVisible:
    element: "Log Out"
- tapOn: "Log Out"
- assertVisible: "Are you sure you want to log out?"
- tapOn:
    text: "Log Out"
    below: "Are you sure you want to log out?"
- extendedWaitUntil:
    visible: "Welcome!"
    timeout: 15000
