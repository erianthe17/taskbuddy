appId: com.taskbuddy.app
name: p7 client Home bell opens Notifications, the list shows notices, and the header back arrow returns to Home
tags:
  - client
  - notifications
---
# Slice 7.2 rows 7.2-01 (bell opens Notifications), 7.2-03 (list shows titles and bodies) and 7.2-36 (back returns
# to Home), client maestro.client@. Read-only: the flow never taps a notification row, "Mark all read", "Clear all"
# or a trash icon, so it changes no read state. It asserts the screen, not counts, so it tolerates any number of
# notices. It creates nothing.
# Login is inlined from p7_chat_completed_job_client.yaml (launch_fresh helper, email-doubling guard, Skip handling).
# The Home bell is an icon-only Button whose content-desc is "Notifications, N unread"; the text selector matches it.
# The header back arrow has no label, so it is tapped by point "9%,6%" (bounds about [53,105][152,205] of 1080x2400).
- runFlow: _helpers/launch_fresh.yaml
- tapOn:
    id: "input-email"
- inputText: "maestro.client@taskbuddy.test"
- runFlow:
    when:
      notVisible: "maestro.client@taskbuddy.test"
    commands:
      - eraseText: 60
      - inputText: "maestro.client@taskbuddy.test"
- tapOn:
    id: "input-password"
- inputText: "TestPass123!"
- hideKeyboard
- tapOn:
    id: "btn-sign-in"
- extendedWaitUntil:
    visible: ".*(Skip|Find a service).*"
    timeout: 60000
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible: "Find a service"
    timeout: 60000
- tapOn:
    text: "Allow"
    optional: true
# Row 7.2-01: the Home bell (not a notification row).
- tapOn:
    text: "Notifications.*"
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 15000
- extendedWaitUntil:
    visible: "(Mark all read|Clear all)"
    timeout: 15000
# Row 7.2-03: the list shows notice titles.
- assertVisible: "New message"
# Row 7.2-36: header back arrow returns to Home.
- tapOn:
    point: "9%,6%"
- extendedWaitUntil:
    visible: "Recent activity"
    timeout: 15000
- assertVisible: "Find a service"
