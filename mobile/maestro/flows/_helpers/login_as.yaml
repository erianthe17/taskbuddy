appId: com.taskbuddy.app
---
# Reusable: log in as any account. Pass LOGIN_EMAIL and LOGIN_PASSWORD with
# `runFlow: {file: ..., env: {...}}`. Same steps as login_client.yaml.
- runFlow: launch_fresh.yaml
- tapOn:
    id: "input-email"
- inputText: ${LOGIN_EMAIL}
- tapOn:
    id: "input-password"
- inputText: ${LOGIN_PASSWORD}
- hideKeyboard
- tapOn:
    id: "btn-sign-in"
- extendedWaitUntil:
    visible: ".*(Skip|Find a service).*"
    timeout: 60000
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible: "Find a service"
    timeout: 60000
