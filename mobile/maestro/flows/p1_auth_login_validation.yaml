appId: com.taskbuddy.app
---
# Slice 1.1 (1.1-05..08, 1.1-04): client-side validation copy and the
# unregistered-email answer on Login. No account is created or changed.
- runFlow: _helpers/launch_fresh.yaml
# Both empty: two inline errors at once.
- tapOn:
    id: "btn-sign-in"
- assertVisible: "Please enter your email address."
- assertVisible: "Please enter your password."
# Malformed email.
- tapOn:
    id: "input-email"
- inputText: "not-an-email"
- tapOn:
    id: "input-password"
- inputText: "abc"
- hideKeyboard
- tapOn:
    id: "btn-sign-in"
- assertVisible: "Please enter a valid email address."
# Unregistered email: same copy as a wrong password, no account enumeration.
- tapOn:
    id: "input-email"
- eraseText: 20
- inputText: "nobody.here@taskbuddy.test"
- hideKeyboard
- tapOn:
    id: "btn-sign-in"
- extendedWaitUntil:
    visible: "Invalid login credentials"
    timeout: 20000
- assertVisible:
    id: "input-email"
