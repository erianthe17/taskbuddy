appId: com.taskbuddy.app
---
# Slice 2.1 (2.1-55, 2.1-65): Change Password round trip on a throwaway account
# registered through the API, deleted at the end. Never touches the password
# of maestro.client@ or maestro.provider@.
# After "Password updated" the app signs the user out on the next request
# (E2E-032), so the flow does not rely on the session surviving: it logs in
# again with the new password.
# WARNING: a run that dies midway leaves maestro.burner.2.1.<ts>@taskbuddy.test.
- evalScript: ${output.RUN = Date.now()}
- runScript:
    file: _helpers/register_burner.js
    env:
      EMAIL: "maestro.burner.2.1.${output.RUN}@taskbuddy.test"
      PASSWORD: "TestPass123!"
- runFlow:
    file: _helpers/login_as.yaml
    env:
      LOGIN_EMAIL: "maestro.burner.2.1.${output.RUN}@taskbuddy.test"
      LOGIN_PASSWORD: "TestPass123!"
- tapOn:
    id: "btn-home-avatar"
- tapOn: "Settings"
- tapOn: "Change Password"
# wrong current password
- tapOn:
    id: "input-current-password"
- inputText: "WrongPass123!"
- tapOn:
    id: "input-new-password"
- inputText: "BurnerNew123!"
- tapOn:
    id: "input-confirm-password"
- inputText: "BurnerNew123!"
- hideKeyboard
- tapOn:
    id: "btn-update-password"
- extendedWaitUntil:
    visible: "Current password is incorrect"
    timeout: 60000
# fix the current password and submit
- tapOn:
    id: "input-current-password"
- eraseText: 20
- inputText: "TestPass123!"
- hideKeyboard
- tapOn:
    id: "btn-update-password"
- extendedWaitUntil:
    visible: "Password updated"
    timeout: 60000
- tapOn: "Done"
# log in with the NEW password (login_as clears app state)
- runFlow:
    file: _helpers/login_as.yaml
    env:
      LOGIN_EMAIL: "maestro.burner.2.1.${output.RUN}@taskbuddy.test"
      LOGIN_PASSWORD: "BurnerNew123!"
# cleanup: delete the burner
- tapOn:
    id: "btn-home-avatar"
- tapOn: "Settings"
- tapOn:
    id: "settings-delete-account-row"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "Delete Account"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: "Welcome!"
    timeout: 60000
