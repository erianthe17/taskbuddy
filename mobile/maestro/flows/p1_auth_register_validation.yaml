appId: com.taskbuddy.app
---
# Slice 1.2: Register screen client-side validation, role switching, modal
# dismissal and the two ways back to Login. Verified in Slice 1.2 (2026-10-08).
# Creates NO account: every Sign Up tap below leaves at least one consent
# unticked or the email invalid, so a submit can never succeed.
# Deliberately does not assert E2E-013 (stale mismatch error), E2E-014 (stale
# consent errors) or E2E-015 (raw "email must be an email" banner). Each
# scenario starts from clearState so no error state is carried over.
# No eraseText: one fresh launch per input variant instead.

# ---- (a) client, empty submit: 7 messages, confirm shows none ----
- runFlow: _helpers/launch_fresh.yaml
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "Sign Up"
- runFlow:
    when:
      visible: "Welcome!"
    commands:
      - tapOn:
          text: "Sign Up"
          optional: true
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
- tapOn: "Client"
- scrollUntilVisible:
    element:
      text: "Sign Up"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign Up"
- scrollUntilVisible:
    element:
      text: "Please accept the Data Collection consent to continue."
    direction: DOWN
    timeout: 20000
- assertVisible: "Please accept the Data Collection consent to continue."
- scrollUntilVisible:
    element:
      text: "Please accept the Privacy Policy to continue."
    direction: UP
    timeout: 20000
- assertVisible: "Please accept the Privacy Policy to continue."
- scrollUntilVisible:
    element:
      text: "Please accept the Terms & Conditions to continue."
    direction: UP
    timeout: 20000
- assertVisible: "Please accept the Terms & Conditions to continue."
- scrollUntilVisible:
    element:
      text: "Passwords do not match."
    direction: UP
    timeout: 5000
    optional: true
- assertNotVisible: "Passwords do not match."
- scrollUntilVisible:
    element:
      text: "Password must be at least 8 characters."
    direction: UP
    timeout: 20000
- assertVisible: "Password must be at least 8 characters."
- scrollUntilVisible:
    element:
      text: "Please enter your email address."
    direction: UP
    timeout: 20000
- assertVisible: "Please enter your email address."
- scrollUntilVisible:
    element:
      text: "Please enter your full name."
    direction: UP
    timeout: 20000
- assertVisible: "Please enter your full name."

# ---- (b) whitespace-only name still gives the name error ----
