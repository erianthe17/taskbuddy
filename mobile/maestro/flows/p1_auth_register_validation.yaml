- tapOn:
    id: "input-name"
- inputText: "   "
- tapOn:
    id: "input-email"
- inputText: "consent.tester@y.com"
- tapOn:
    id: "input-password"
- inputText: "TestPass123!"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "input-confirm-password"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "input-confirm-password"
- inputText: "TestPass123!"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Sign Up"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign Up"
- scrollUntilVisible:
    element:
      text: "Please enter your full name."
    direction: UP
    timeout: 20000
- assertVisible: "Please enter your full name."

