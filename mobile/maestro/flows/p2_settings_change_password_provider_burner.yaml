appId: com.taskbuddy.app
---
# Slice 2.2 (2.2-66, 2.2-69): Change Password round trip on a throwaway provider
# registered through the API (wrong current password, then success, then log in with
# the new one), then Delete Account to clean up. Never touches the password of
# maestro.provider@ or maestro.provider2@. Same signed-out-after-update behaviour as
# the client (E2E-032), so the flow logs in again instead of relying on the session.
# WARNING: a run that dies midway leaves maestro.burner.2.2.<ts>@taskbuddy.test.
- evalScript: ${output.RUN = Date.now()}
- runScript:
    file: _helpers/register_burner_provider.js
    env:
      EMAIL: "maestro.burner.2.2.${output.RUN}@taskbuddy.test"
      PASSWORD: "TestPass123!"
      CATEGORY_ID: "1"
- runFlow:
    file: _helpers/login_as_provider.yaml
    env:
      LOGIN_EMAIL: "maestro.burner.2.2.${output.RUN}@taskbuddy.test"
      LOGIN_PASSWORD: "TestPass123!"
- tapOn:
    id: "btn-home-avatar"
- scrollUntilVisible:
    element: "Settings"
- tapOn: "Settings"
- tapOn: "Change Password"
- tapOn:
    id: "input-current-password"
- inputText: "WrongPass123!"
- tapOn:
    id: "input-new-password"
- inputText: "BurnerNew123!"
- tapOn:
    id: "input-confirm-password"
- inputText: "BurnerNew123!"
- hideKeyboard
- tapOn:
    id: "btn-update-password"
- extendedWaitUntil:
    visible: "Current password is incorrect"
    timeout: 60000
- tapOn:
    id: "input-current-password"
- eraseText: 20
- inputText: "TestPass123!"
- hideKeyboard
- tapOn:
    id: "btn-update-password"
- extendedWaitUntil:
    visible: "Password updated"
    timeout: 60000
- tapOn: "Done"
- runFlow:
    file: _helpers/login_as_provider.yaml
    env:
      LOGIN_EMAIL: "maestro.burner.2.2.${output.RUN}@taskbuddy.test"
      LOGIN_PASSWORD: "BurnerNew123!"
- tapOn:
    id: "btn-home-avatar"
- scrollUntilVisible:
    element: "Settings"
- tapOn: "Settings"
- tapOn: "Delete Account"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "Delete"
    rightOf: "Keep My Account"
- extendedWaitUntil:
    visible: "Welcome!"
    timeout: 60000
