appId: com.taskbuddy.app
name: p6 client wallet figures match GET /wallet
tags:
  - client
  - wallet
  - money
---
# Slice 6.1 (rows 6.1-01, 6.1-02, 6.1-04, client Wallet overview for maestro.client@ = c1): the balance card,
# the IN ESCROW card and the top row of the All list must equal what GET /wallet returns for c1. The helper
# _helpers/wallet_expected.js reads the live ledger before the device starts (balance, in_escrow, and the
# newest transaction with the sign HOWalletScreen prints), so the flow tracks whatever the ledger holds and
# does not assume the packet snapshot (48,723 / 500 / -777). Read-only: the helper only logs in and calls
# GET /wallet, and the flow taps nav-tab-Wallet and nothing else on the Wallet screen (no Add Money,
# Withdraw, tab change or row tap). It creates no job and moves no money.
# Login is inlined from _helpers/login_client.yaml (same steps, plus the email-doubling guard from
# p5_decline_refund_provider.yaml). The guard erases the field and types the address again when the exact
# address is not on screen.
- runScript: _helpers/wallet_expected.js
- runFlow: _helpers/launch_fresh.yaml
- tapOn:
    id: "input-email"
- inputText: "maestro.client@taskbuddy.test"
- runFlow:
    when:
      notVisible: "maestro.client@taskbuddy.test"
    commands:
      - eraseText: 60
      - inputText: "maestro.client@taskbuddy.test"
- tapOn:
    id: "input-password"
- inputText: "TestPass123!"
- hideKeyboard
- tapOn:
    id: "btn-sign-in"
- extendedWaitUntil:
    visible: ".*(Skip|Find a service).*"
    timeout: 60000
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible: "Find a service"
    timeout: 60000
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    id: "nav-tab-Wallet"
# Row 6.1-01: the balance figure under "Available Balance" equals GET /wallet balance.
- extendedWaitUntil:
    visible: "${output.W_BALANCE_RE}"
    timeout: 30000
# Row 6.1-02: the IN ESCROW figure equals GET /wallet in_escrow.
- assertVisible: "${output.W_ESCROW_RE}"
# Row 6.1-04: the newest row of the All list (default tab) has the API title and the signed API amount.
- assertVisible: "${output.W_TOP_TITLE_RE}"
- assertVisible: "${output.W_TOP_AMOUNT_RE}"
